name: Publish NuGet

on:
  push:
    tags:
      - 'v*.*.*'

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PACKAGE_PROJECT: src/Intent/Intent.csproj

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Trusted Publishing (OIDC → NuGet)
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-preview.1, got: $TAG"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Restore
        run: dotnet restore Intent.sln

      - name: Test
        run: dotnet test Intent.sln -c Release --verbosity normal

      - name: Pack
        run: |
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          dotnet pack "$PACKAGE_PROJECT" \
            -c Release \
            --no-restore \
            -o artifacts \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:PackageVersion=${{ steps.version.outputs.version }} \
            -p:RepositoryUrl="$REPO_URL" \
            -p:PackageProjectUrl="$REPO_URL" \
            -p:ContinuousIntegrationBuild=true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: Choose NuGet auth mode
        id: auth
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -n "$NUGET_API_KEY" ]; then
            echo "mode=apikey" >> "$GITHUB_OUTPUT"
            echo "Auth: NUGET_API_KEY"
          elif [ -n "$NUGET_USER" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
            echo "Auth: Trusted Publishing (NUGET_USER)"
          else
            echo "::error::Set secret NUGET_API_KEY, or NUGET_USER + a Trusted Publishing policy on nuget.org for workflow publish.yml"
            exit 1
          fi

      - name: NuGet login (Trusted Publishing)
        if: steps.auth.outputs.mode == 'oidc'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          OIDC_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          API_KEY="${NUGET_API_KEY:-$OIDC_API_KEY}"
          if [ -z "$API_KEY" ]; then
            echo "::error::No NuGet API key available"
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
